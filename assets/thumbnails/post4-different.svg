<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1200" height="628" fill="#051a0f"/>
  <rect x="0" y="0" width="1200" height="60" fill="#0a2e18"/>
  <circle cx="34" cy="30" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="30" r="7" fill="#febc2e"/>
  <circle cx="82" cy="30" r="7" fill="#28c840"/>

  <text x="700" y="150" font-size="40" font-weight="bold" fill="#ffffff">What I'd do</text>
  <text x="700" y="200" font-size="40" font-weight="bold" fill="#4fd67a">differently</text>

  <rect x="40" y="100" width="600" height="470" rx="8" fill="#04140a" stroke="#1a5c30" stroke-width="1.5"/>

  <text x="64" y="140" font-size="14" fill="#ff9f9f" font-weight="bold" font-family="Consolas, monospace">BEFORE</text>
  <text x="64" y="165" font-size="13" fill="#e8b0b0" font-family="Consolas, monospace">Policy propagation not verified,</text>
  <text x="64" y="188" font-size="13" fill="#e8b0b0" font-family="Consolas, monospace">test ran immediately after assign</text>

  <text x="64" y="240" font-size="14" fill="#8fffb0" font-weight="bold" font-family="Consolas, monospace">FIX</text>
  <text x="64" y="265" font-size="13" fill="#c8ecd4" font-family="Consolas, monospace">az policy assignment list \</text>
  <text x="64" y="288" font-size="13" fill="#c8ecd4" font-family="Consolas, monospace">  --query "[?name=='Restrict-VM-Sizes']"</text>
  <text x="64" y="311" font-size="13" fill="#c8ecd4" font-family="Consolas, monospace">wait 15 min, then re-test</text>

  <text x="64" y="365" font-size="14" fill="#7ec4ff" font-weight="bold" font-family="Consolas, monospace">VERIFY</text>
  <text x="64" y="390" font-size="13" fill="#bcdcff" font-family="Consolas, monospace">az vm create --size Standard_D2s_v3</text>
  <text x="64" y="413" font-size="13" fill="#bcdcff" font-family="Consolas, monospace">expect: Validation failed</text>
</svg>
