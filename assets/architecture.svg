<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0f2540"/>
    </linearGradient>
    <linearGradient id="rbacCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0f2740"/>
    </linearGradient>
    <linearGradient id="policyCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c1a2a"/>
      <stop offset="100%" stop-color="#3a1018"/>
    </linearGradient>
    <linearGradient id="budgetCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4a1a"/>
      <stop offset="100%" stop-color="#3a2e10"/>
    </linearGradient>
    <linearGradient id="identityCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1a5c"/>
      <stop offset="100%" stop-color="#22103a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <style>
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dash 1.6s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -24; }
      }
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .blocked-x {
        animation: pulse 1.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="42" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Lab 05 - Governance and Security Hardening</text>
  <text x="600" y="66" font-size="14" fill="#7ea6d6" text-anchor="middle">RBAC + Azure Policy + Cost Management, mapped to the NIST Cybersecurity Framework</text>

  <!-- Subscription boundary -->
  <rect x="30" y="90" width="1140" height="410" rx="14" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="55" y="76" width="180" height="26" rx="13" fill="#0f2540" stroke="#2f6fb3" stroke-width="1.5"/>
  <text x="145" y="94" font-size="12" fill="#8fc1ff" text-anchor="middle" font-weight="bold">Azure Subscription</text>

  <!-- Admin card -->
  <rect x="60" y="120" width="230" height="150" rx="10" fill="url(#identityCard)" stroke="#7a4fc9" stroke-width="1.5"/>
  <circle cx="90" cy="148" r="9" fill="#a97fff"/>
  <path d="M85 152 h10 v6 h-10 z" fill="#a97fff"/>
  <text x="108" y="153" font-size="13" font-weight="bold" fill="#ffffff">Cloud Admin (Owner)</text>
  <text x="76" y="176" font-size="10.5" fill="#c9b8ec">Creates the Junior Developer</text>
  <text x="76" y="193" font-size="10.5" fill="#c9b8ec">Assigns Reader role</text>
  <text x="76" y="210" font-size="10.5" fill="#c9b8ec">Assigns VM-size policy</text>
  <text x="76" y="230" font-size="10" fill="#8f7fc9" font-style="italic">NIST: Identify</text>
  <rect x="76" y="238" width="180" height="18" rx="5" fill="#3a1a5c" stroke="#a97fff" stroke-width="1"/>
  <text x="166" y="251" font-size="9.5" fill="#e8dcff" text-anchor="middle">rg-lab05-gov-[yourname]</text>

  <!-- RBAC card -->
  <rect x="330" y="120" width="230" height="150" rx="10" fill="url(#rbacCard)" stroke="#2f8fd6" stroke-width="1.5"/>
  <rect x="352" y="140" width="18" height="22" rx="3" fill="#5db3ff"/>
  <circle cx="361" cy="147" r="4" fill="#0f2740"/>
  <text x="382" y="153" font-size="13" font-weight="bold" fill="#ffffff">RBAC</text>
  <text x="348" y="176" font-size="10.5" fill="#bcdcff">Reader role -&gt; Junior Developer</text>
  <text x="348" y="193" font-size="10.5" fill="#bcdcff">Scope: this resource group only</text>
  <text x="348" y="210" font-size="10.5" fill="#bcdcff">View only, zero write access</text>
  <text x="348" y="230" font-size="10" fill="#5db3ff" font-style="italic">NIST: Protect - least privilege</text>

  <!-- Policy card -->
  <rect x="600" y="120" width="230" height="150" rx="10" fill="url(#policyCard)" stroke="#d64f4f" stroke-width="1.5"/>
  <rect x="622" y="140" width="18" height="22" rx="3" fill="#ff8080"/>
  <text x="631" y="156" font-size="12" fill="#3a1018" text-anchor="middle" font-weight="bold">!</text>
  <text x="652" y="153" font-size="13" font-weight="bold" fill="#ffffff">Azure Policy</text>
  <text x="618" y="176" font-size="10.5" fill="#ffcccc">Restrict-VM-Sizes assignment</text>
  <text x="618" y="193" font-size="10.5" fill="#ffcccc">Allows only B1s / B1ms</text>
  <text x="618" y="210" font-size="10.5" fill="#ffcccc">Applies to Admin too (Deny)</text>
  <text x="618" y="230" font-size="10" fill="#ff8080" font-style="italic">NIST: Protect - block misconfig</text>

  <!-- Junior developer card -->
  <rect x="60" y="300" width="230" height="140" rx="10" fill="#241a0f" stroke="#d68f2f" stroke-width="1.5"/>
  <circle cx="90" cy="328" r="9" fill="#ffb84f"/>
  <path d="M84 333 q6 -8 12 0 z" fill="#ffb84f"/>
  <text x="108" y="333" font-size="13" font-weight="bold" fill="#ffffff">Junior Developer</text>
  <text x="76" y="356" font-size="10.5" fill="#f0d0a0">Reader role only</text>
  <text x="76" y="373" font-size="10.5" fill="#f0d0a0">Simulated via Incognito browser</text>
  <text x="76" y="393" font-size="10" fill="#ffb84f" font-style="italic">Tries: create Storage Account</text>

  <!-- VM deployment attempt card -->
  <rect x="330" y="300" width="500" height="140" rx="10" fill="#241014" stroke="#d64f4f" stroke-width="1.5"/>
  <text x="352" y="326" font-size="13" font-weight="bold" fill="#ffffff">VM Deployment Attempt</text>

  <rect x="352" y="340" width="200" height="34" rx="6" fill="#123a1e" stroke="#4fd67a" stroke-width="1.5"/>
  <text x="452" y="361" font-size="11" fill="#8fffb0" text-anchor="middle" font-weight="bold">Standard_B1s - ALLOWED</text>

  <rect x="565" y="340" width="245" height="34" rx="6" fill="#3a1018" stroke="#d64f4f" stroke-width="1.5" class="blocked-x"/>
  <text x="687" y="361" font-size="11" fill="#ffb0b0" text-anchor="middle" font-weight="bold">Standard_D2s_v3 - BLOCKED</text>

  <text x="352" y="396" font-size="10" fill="#e0a0a0">Policy evaluates before the resource is created</text>
  <text x="352" y="414" font-size="9.5" fill="#ff8080" font-family="Consolas, monospace">"Validation failed - Policy check failed: Restrict-VM-Sizes"</text>

  <!-- Budget row -->
  <rect x="60" y="460" width="1080" height="130" rx="12" fill="url(#budgetCard)" stroke="#d6a92f" stroke-width="1.5" stroke-dasharray="none"/>
  <text x="600" y="486" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Cost Management - Budget and Alerts</text>
  <text x="600" y="503" font-size="10" fill="#e8d090" text-anchor="middle" font-style="italic">NIST: Detect - abnormal spend is a security signal</text>

  <!-- Budget mini-cards -->
  <rect x="90" y="516" width="230" height="58" rx="7" fill="#3a2e10" stroke="#d6a92f" stroke-width="1"/>
  <text x="105" y="534" font-size="11" font-weight="bold" fill="#ffe8a0">Monthly-Lab-Budget</text>
  <text x="105" y="550" font-size="9.5" fill="#e8d090">$50 / billing month, resource group scope</text>
  <text x="105" y="565" font-size="9.5" fill="#e8d090">Resets on the 1st</text>

  <rect x="340" y="516" width="230" height="58" rx="7" fill="#3a2e10" stroke="#d6a92f" stroke-width="1"/>
  <text x="355" y="534" font-size="11" font-weight="bold" fill="#ffe8a0">Actual alert - 80%</text>
  <text x="355" y="550" font-size="9.5" fill="#e8d090">Fires once $40 is actually spent</text>
  <text x="355" y="565" font-size="9.5" fill="#e8d090">Ground truth signal</text>

  <rect x="590" y="516" width="230" height="58" rx="7" fill="#3a2e10" stroke="#d6a92f" stroke-width="1"/>
  <text x="605" y="534" font-size="11" font-weight="bold" fill="#ffe8a0">Forecasted alert - 100%</text>
  <text x="605" y="550" font-size="9.5" fill="#e8d090">Fires when trend projects &gt;$50</text>
  <text x="605" y="565" font-size="9.5" fill="#e8d090">Early warning signal</text>

  <rect x="840" y="516" width="270" height="58" rx="7" fill="#241a0f" stroke="#7a8fa0" stroke-width="1"/>
  <text x="855" y="534" font-size="11" font-weight="bold" fill="#ffffff">What it does NOT do</text>
  <text x="855" y="550" font-size="9.5" fill="#c0c8d0">Does not stop spend or delete anything</text>
  <text x="855" y="565" font-size="9.5" fill="#c0c8d0">It is a smoke detector, not a fire suppressor</text>

  <!-- Flow lines -->
  <path id="path1" d="M 290 175 L 330 175" fill="none" stroke="#5db3ff" stroke-width="2" class="flow-line"/>
  <path id="path2" d="M 290 210 L 600 210" fill="none" stroke="#ff8f8f" stroke-width="2" class="flow-line"/>
  <path id="path3" d="M 175 270 L 175 300" fill="none" stroke="#ffb84f" stroke-width="2" class="flow-line"/>
  <path id="path4" d="M 290 370 L 330 370" fill="none" stroke="#d64f4f" stroke-width="2" class="flow-line"/>

  <circle r="4" fill="#5db3ff"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"><mpath href="#path1"/></animateMotion></circle>
  <circle r="4" fill="#ff8f8f"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.3s"><mpath href="#path2"/></animateMotion></circle>
  <circle r="4" fill="#ffb84f"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.6s"><mpath href="#path3"/></animateMotion></circle>
  <circle r="4" fill="#d64f4f"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.9s"><mpath href="#path4"/></animateMotion></circle>

  <!-- Step badges -->
  <circle cx="312" cy="168" r="11" fill="#0f2540" stroke="#5db3ff" stroke-width="1.5"/>
  <text x="312" y="172" font-size="10" fill="#5db3ff" text-anchor="middle" font-weight="bold">1</text>
  <circle cx="580" cy="203" r="11" fill="#0f2540" stroke="#ff8f8f" stroke-width="1.5"/>
  <text x="580" y="207" font-size="10" fill="#ff8f8f" text-anchor="middle" font-weight="bold">2</text>
  <circle cx="175" cy="290" r="11" fill="#0f2540" stroke="#ffb84f" stroke-width="1.5"/>
  <text x="175" y="294" font-size="10" fill="#ffb84f" text-anchor="middle" font-weight="bold">3</text>
  <circle cx="312" cy="363" r="11" fill="#0f2540" stroke="#d64f4f" stroke-width="1.5"/>
  <text x="312" y="367" font-size="10" fill="#d64f4f" text-anchor="middle" font-weight="bold">4</text>

  <!-- Status pulse indicators -->
  <circle cx="810" cy="140" r="5" fill="#4fd67a" class="pulse"/>
  <circle cx="290" cy="140" r="5" fill="#5db3ff" class="pulse"/>
  <circle cx="80" cy="470" r="5" fill="#d6a92f" class="pulse"/>

  <!-- Result box -->
  <rect x="60" y="610" width="1080" height="90" rx="10" fill="#0f2018" stroke="#4fd67a" stroke-width="1.5"/>
  <text x="90" y="636" font-size="12" font-weight="bold" fill="#8fffb0">Verified result</text>
  <text x="90" y="658" font-size="11" fill="#c8ecd4" font-family="Consolas, monospace">Reader test: AuthorizationFailed on Storage Account create</text>
  <text x="90" y="676" font-size="11" fill="#c8ecd4" font-family="Consolas, monospace">Policy test: D2s_v3 blocked, B1s validated / Budget: 80% Actual + 100% Forecasted alerts armed</text>

</svg>
